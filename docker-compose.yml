services:
  postgres:
    image: postgres:15
    container_name: nutricion-db-dev
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres_data_dev:/var/lib/postgresql/data
volumes:
  postgres_data_dev:
